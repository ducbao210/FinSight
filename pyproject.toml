[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "Evidence-grounded financial question answering over FinanceBench filings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyMuPDF==1.28.2",
    "pymupdf-layout==1.28.2",
    "pymupdf4llm==1.28.2",
    "langchain-core>=0.3,<1",
    "langchain-groq>=0.2,<1",
    "langchain-huggingface>=0.1,<1",
    "langchain-text-splitters>=0.3,<1",
    "langgraph>=0.2,<1",
    "transformers>=4.55,<5",
    "accelerate>=0.34,<2",
    "bitsandbytes>=0.43,<1",
    "chromadb>=1.0,<2",
    "sentence-transformers>=3,<6",
    "rank-bm25>=0.2,<1",
    "streamlit>=1.39,<2",
    "httpx>=0.27,<1",
    "ranx>=0.3,<1",
    "ragas>=0.2,<1",
]

[project.optional-dependencies]
gguf = [
    "llama-cpp-python>=0.3.16",
]

[tool.setuptools.packages.find]
include = ["src*"]
